name: Build Improvement Radar HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create BigQuery credentials
        env:
          BQ_SERVICE_ACCOUNT: ${{ secrets.BQ_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$BQ_SERVICE_ACCOUNT" > "$RUNNER_TEMP/bq-service-account.json"
          chmod 600 "$RUNNER_TEMP/bq-service-account.json"

      - name: Build Docker image
        run: docker build -t improvement-radar .

      - name: Run notebook and generate HTML
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/bq-service-account.json:/workspace/bq-service-account.json:ro" \
            improvement-radar \
            bash -c '
              cd /workspace/notebooks &&
              jupyter nbconvert \
                --to html \
                --execute \
                sicbl-improvement-radar.ipynb \
                --no-input \
                --ExecutePreprocessor.timeout=-1
            '

      - name: Add custom stylesheet
        run: |
          sed -i '/<style type="text\/css">/i <link rel="stylesheet" href="custom.css">' \
            notebooks/sicbl-improvement-radar.html

      - name: Check generated HTML
        run: |
          ls -lh notebooks/sicbl-improvement-radar.html

      - name: Remove BigQuery credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/bq-service-account.json"

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Safety check: never allow BigQuery credentials to be committed
          if git diff --cached --name-only | grep -qx "bq-service-account.json"; then
            echo "ERROR: BigQuery credentials are staged. Aborting."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            echo "Files to be committed:"
            git diff --cached --name-status

            git commit -m "Update Improvement Radar"
            git push
          fi